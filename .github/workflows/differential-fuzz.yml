name: Semantic differential fuzz

# Long, sharded runs of tools/differential_fuzz.py. Each shard fuzzes a
# recorded, deterministic seed range; Linux and macOS run the same seeds,
# and generation is byte-identical across hosts, so a divergence on one OS
# reproduces from its seed and case number anywhere. The short smoke run
# lives in normal CI (make fuzz-differential-smoke).

on:
  workflow_call:
    inputs:
      candidate:
        type: boolean
        default: false
      seconds:
        type: number
        default: 7200
  workflow_dispatch:
    inputs:
      candidate:
        description: Run the release-blocking three-host campaign
        type: boolean
        default: false
      seconds:
        description: Primary-host stress seconds (less than 7200 remains incomplete)
        default: "7200"
      cases:
        description: Cases per shard
        required: true
        default: "400"
      start_seed:
        description: First shard's seed (shard N uses start_seed + N - 1)
        required: true
        default: "100"
  schedule:
    - cron: "47 3 * * 0"

permissions:
  contents: read

jobs:
  fuzz:
    if: ${{ !inputs.candidate }}
    name: seed sweep (${{ matrix.os }}, shard ${{ matrix.shard }}/4, ${{ matrix.groups }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
        # half the shards run the scalar/struct/enum groups, half run
        # every group together so cross-group interactions (class calls
        # inside match arms, objects in struct-heavy code) stay fuzzed
        groups:
          - core,widths,strings,structs,enums
          - core,widths,strings,structs,enums,classes,packages
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-beansc

      - name: Install toolchain
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/apt-update.sh
          sudo apt-get install -y --no-install-recommends clang lld llvm

      - name: Build the compilers
        run: make

      - name: Fuzz one recorded seed
        env:
          INPUT_CASES: ${{ github.event_name == 'workflow_dispatch' && inputs.cases || '400' }}
          INPUT_START_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.start_seed || (100 + 4 * github.run_number) }}
          SHARD: ${{ matrix.shard }}
          FUZZ_GROUPS: ${{ matrix.groups }}
        run: |
          case "$INPUT_CASES" in ''|*[!0-9]*)
            echo "cases must be a whole number" >&2; exit 2 ;; esac
          case "$INPUT_START_SEED" in ''|*[!0-9]*)
            echo "start_seed must be a whole number" >&2; exit 2 ;; esac
          FUZZ_SEED=$(( INPUT_START_SEED + SHARD - 1 ))
          # The recorded, non-overlapping seed range this shard owns — in the
          # job summary so a failure names its reproducer without log digging.
          echo "shard $SHARD: seed $FUZZ_SEED, cases 0..$(( INPUT_CASES - 1 )), groups $FUZZ_GROUPS" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          export FUZZ_SEED
          export FUZZ_CASES="$INPUT_CASES"
          export FUZZ_LANES=all
          export FUZZ_REDUCE=1
          make fuzz-differential

      - name: Fuzz OOP and generic-struct interactions
        if: contains(matrix.groups, 'classes')
        env:
          INPUT_CASES: ${{ github.event_name == 'workflow_dispatch' && inputs.cases || '400' }}
          INPUT_START_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.start_seed || (100 + 4 * github.run_number) }}
          SHARD: ${{ matrix.shard }}
        run: |
          OOP_FUZZ_SEED=$(( INPUT_START_SEED + SHARD - 1 ))
          export OOP_FUZZ_SEED
          export OOP_FUZZ_CASES="$INPUT_CASES"
          export OOP_FUZZ_LANES=interp,debug,release,lto
          make fuzz-oop

      - name: Fuzz ownership — what a Mutex owns, and one live reader
        if: contains(matrix.groups, 'classes')
        env:
          INPUT_CASES: ${{ github.event_name == 'workflow_dispatch' && inputs.cases || '400' }}
          INPUT_START_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.start_seed || (100 + 4 * github.run_number) }}
          SHARD: ${{ matrix.shard }}
        run: |
          OWNERSHIP_FUZZ_SEED=$(( INPUT_START_SEED + SHARD - 1 ))
          export OWNERSHIP_FUZZ_SEED
          export OWNERSHIP_FUZZ_CASES="$INPUT_CASES"
          export OWNERSHIP_FUZZ_LANES=interp,debug,release,lto
          make fuzz-ownership

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: differential-fuzz-failures-${{ matrix.os }}-shard-${{ matrix.shard }}-${{ contains(matrix.groups, 'classes') && 'classes' || 'scalars' }}
          path: |
            build/differential-fuzz/failures/
            build/oop-fuzz/failures/
            build/ownership-fuzz/failures/
            build/fuzz-artifacts/
          if-no-files-found: ignore

  candidate:
    if: ${{ inputs.candidate }}
    name: compiler candidate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-beansc
      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/apt-update.sh
          sudo apt-get install -y --no-install-recommends clang lld llvm ripgrep
      - name: Install macOS test tools
        if: runner.os == 'macOS'
        # The final gates run every core test. test/tls.sh's honest-close
        # control needs an `openssl s_server` that sends close_notify, which
        # the system LibreSSL does not (BUGFIX_TODO.md CD-18); bash 3.2 is
        # the system shell, and ripgrep is used by the core tests.
        run: |
          brew install bash openssl@3 ripgrep
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Install Windows toolchain
        if: runner.os == 'Windows'
        shell: bash
        env:
          BEANS_LLVM_MINGW_CRT: ucrt
        run: |
          bin=$(bash test/windows_toolchain.sh)
          echo "$bin" >> "$GITHUB_PATH"
          echo "BEANS_CC=$(cygpath -w "$bin/clang.exe")" >> "$GITHUB_ENV"
      - name: Build Unix compiler
        if: runner.os != 'Windows'
        run: make
      - name: Build Windows compiler
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p build
          beansc build --release src/main.b --target x86_64-pc-windows-gnullvm -o build/beansc.exe
      - name: Run candidate campaign and deterministic replay
        shell: bash
        env:
          CAMPAIGN_SECONDS: ${{ inputs.seconds }}
        run: |
          args=(--seed "$GITHUB_RUN_NUMBER" --out build/compiler-discovery/candidate)
          if [ "$RUNNER_OS" = Windows ]; then
            args+=(--beansc build/beansc.exe --replay-only --seconds 0)
          else
            args+=(--seconds "$CAMPAIGN_SECONDS")
          fi
          python -u tools/compiler_campaign.py "${args[@]}"
      - name: Upload candidate evidence, including failures and missing gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-candidate-${{ matrix.os }}
          path: build/compiler-discovery/
          if-no-files-found: error

  replay-retained:
    if: ${{ always() && inputs.candidate }}
    needs: candidate
    name: retained corpus replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-beansc
      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/apt-update.sh
          sudo apt-get install -y --no-install-recommends clang lld llvm ripgrep
      - name: Install Windows toolchain
        if: runner.os == 'Windows'
        shell: bash
        env:
          BEANS_LLVM_MINGW_CRT: ucrt
        run: |
          bin=$(bash test/windows_toolchain.sh)
          echo "$bin" >> "$GITHUB_PATH"
          echo "BEANS_CC=$(cygpath -w "$bin/clang.exe")" >> "$GITHUB_ENV"
      - name: Build Unix compiler
        if: runner.os != 'Windows'
        run: make
      - name: Build Windows compiler
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p build
          beansc build --release src/main.b --target x86_64-pc-windows-gnullvm -o build/beansc.exe
      - uses: actions/download-artifact@v4
        with:
          pattern: compiler-candidate-*
          path: build/retained
      - name: Require evidence from all candidate hosts
        shell: bash
        run: |
          for host in ubuntu-24.04 macos-latest windows-latest; do
            test -f "build/retained/compiler-candidate-$host/candidate/report.json"
          done
      - name: Replay every original and minimized retained failure
        shell: bash
        run: |
          args=(--replay-only --seconds 0 --seed "$GITHUB_RUN_NUMBER"
                --replay-root build/retained --out build/compiler-discovery/replay)
          if [ "$RUNNER_OS" = Windows ]; then args+=(--beansc build/beansc.exe); fi
          python -u tools/compiler_campaign.py "${args[@]}"
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-replay-${{ matrix.os }}
          path: build/compiler-discovery/
          if-no-files-found: error
