name: Set up beansc
description: >-
  Install a released Beans compiler and put it on PATH.

  Beans is self-hosted, so every job that builds the compiler needs a compiler
  to build it with. This used to come from the C++ stage-0 submodule, which
  each job checked out and compiled. With that gone, a released beansc is what
  `make` bootstraps from, exactly as a contributor's first build does.

  Note the floor this implies: the released compiler must already understand
  every language feature `src/` uses. `make` checks that before it starts and
  says so in one line if the release is too old.
inputs:
  version:
    description: Release to install. Defaults to the latest.
    required: false
    default: latest
runs:
  using: composite
  steps:
    - name: Install a released beansc
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ inputs.version }}" = latest ]; then
          url=https://github.com/beans-lang/beans/releases/latest/download/beans-install.sh
          curl -fsSL "$url" | sh
        else
          url=https://github.com/beans-lang/beans/releases/latest/download/beans-install.sh
          curl -fsSL "$url" | sh -s -- --version "${{ inputs.version }}"
        fi
        echo "${BEANS_HOME:-$HOME/.beans}/bin" >> "$GITHUB_PATH"

    - name: Install a released beansc (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Invoke-RestMethod https://github.com/beans-lang/beans/releases/latest/download/beans-install.ps1 | Invoke-Expression
        $root = "$env:LOCALAPPDATA\Beans"
        # Git Bash does not resolve beansc.cmd when a workflow invokes
        # `beansc`. Keep the user-facing launcher, and expose an .exe copy for
        # CI together with the environment that launcher normally sets.
        Copy-Item "$root\bin\beansc.real.exe" "$root\bin\beansc.exe" -Force
        "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        "BEANS_HOME=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "BEANS_RUNTIME=$root\bin\beans_rt.c" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "BEANS_WASM_HOST=$root\bin\wasm_host.c" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "BEANS_STDLIB=$root\lib\std" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "BEANS_ENCODING=$root\lib\encoding" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    # GITHUB_PATH changes are visible after this composite action returns, not
    # to a later run step inside the same action. Report through the installed
    # path on Windows; callers still receive that directory on PATH.
    - name: Report what will do the bootstrapping
      if: runner.os != 'Windows'
      shell: bash
      run: beansc --version

    - name: Report what will do the bootstrapping (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: '& "$env:LOCALAPPDATA\Beans\bin\beansc.exe" --version'
